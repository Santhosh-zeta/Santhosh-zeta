name: Profile

on:
  schedule:
    - cron: "17 3 * * *" # nightly
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - profile.toml
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

env:
  OWNER_NAME: Santhosh-zeta
  OWNER_EMAIL: iamsanthosh2425@gmail.com

jobs:
  live-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Start from the last published cards so a failed run never blanks the profile.
      - name: Fetch published cards
        run: |
          mkdir -p dist
          if git fetch --quiet --depth=1 origin output 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C dist
          fi
          rm -f dist/github-* dist/snake-* dist/README.md

      - name: Render live cards
        env:
          # Optional: a classic PAT with read:user adds private contribution counts.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/generate.py --live --out dist --readme README.md

      - name: Publish to the output branch
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/output.index"
          export GIT_AUTHOR_NAME="$OWNER_NAME" GIT_AUTHOR_EMAIL="$OWNER_EMAIL"
          export GIT_COMMITTER_NAME="$OWNER_NAME" GIT_COMMITTER_EMAIL="$OWNER_EMAIL"
          git --work-tree=dist add --all
          commit=$(git commit-tree "$(git write-tree)" -m "Publish profile cards")
          # One orphan commit, force-pushed: the branch never accumulates history.
          git push --force --quiet origin "$commit:refs/heads/output"

      - name: Commit refreshed work grid
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then echo "README unchanged"; exit 0; fi
          git add README.md
          git -c user.name="$OWNER_NAME" -c user.email="$OWNER_EMAIL" commit --quiet -m "Refresh featured work"
          git push --quiet origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --quiet --rebase origin "$GITHUB_REF_NAME"
            git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
          }

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/profile.yml/enable"
