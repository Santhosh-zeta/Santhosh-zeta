name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - profile.toml
      - scripts/**
      - tests/**
      - assets/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (includes "committed assets match profile.toml")
        run: python -m unittest discover -s tests -t . -v
      - name: Render every card from sample data
        run: |
          for kind in rich new empty; do
            python scripts/generate.py --sample "$kind" --out "$RUNNER_TEMP/preview-$kind" --today 2026-11-09
          done
